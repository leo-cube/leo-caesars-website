name: Build and Deploy Vite App to Hostinger

on:
  push:
    branches:
      - web1.0

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Vite Project
        run: npm run build

      - name: Copy .htaccess (if exists)
        run: |
          if [ -f .htaccess ]; then
            cp .htaccess dist/
          fi

      - name: List dist folder content for debug
        run: ls -R dist/

      - name: Upload dist/ to Hostinger FTP
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          lftp -c "
            open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_SERVER }};
            mirror -R dist/ public_html/ --overwrite --verbose
          "
