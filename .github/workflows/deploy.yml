name: Build and Deploy Vite App to Hostinger

on:
  push:
    branches:
      - web1.0

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build the Vite project
        run: npm run build

      - name: Ensure dist folder exists
        run: |
          mkdir -p dist
          echo "dist folder verified or created"

      - name: Copy .htaccess (if exists)
        run: |
          if [ -f .htaccess ]; then
            cp .htaccess dist/
          fi

      - name: Deploy dist contents to Hostinger via FTP
        uses: samkirkland/ftp-deploy-action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          local-dir: dist/
          dangerous-clean-slate: true
