name: Build and Deploy Vite App to Hostinger

on:
  push:
    branches:
      - web1.0

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build the Vite project
        run: npm run build

      - name: Copy .htaccess file if exists
        run: |
          if [ -f .htaccess ]; then
            cp .htaccess dist/
          fi

      - name: Push dist folder back to repo
        env:
          TOKEN: ${{ secrets.ACTIONS_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${TOKEN}@github.com/${{ github.repository }}
          git add dist
          git commit -m "Auto-build: update dist folder [skip ci]" || echo "No changes to commit"
          git push origin web1.0

  deploy:
    needs: build-and-commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to Hostinger via FTP
        uses: samkirkland/ftp-deploy-action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          local-dir: dist/
          dangerous-clean-slate: true
