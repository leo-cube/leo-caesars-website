name: 🚀 Deploy to Hostinger via FTP (Only dist contents)

on:
  push:
    branches:
      - web1.0

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Project (Vite)
        run: npm run build

      - name: Debug:List dist folder contents
        run: |
          echo "🧾 Listing files inside dist/"
          ls -al dist
          echo "📂 Nested structure:"
          find dist

      - name: 🚀 Deploy dist/ contents via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: dist/
          server-dir: public_html/
          dangerous-clean-slate: true # optional: clears remote before upload
